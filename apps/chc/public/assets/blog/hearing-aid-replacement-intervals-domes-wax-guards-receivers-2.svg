<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Replacement Intervals">
  <defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs>
  <rect width="800" height="520" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="90" fill="url(#hd)"/>
  <rect x="0" y="86" width="800" height="4" fill="#e0ae3c"/>
  <text x="44" y="44" font-family="Georgia, serif" font-size="25" fill="#ffffff" font-weight="bold">Replacement Intervals</text>
  <text x="44" y="70" font-family="Georgia, serif" font-size="15" fill="#86d0d5">Starting points — your wax matters more than the calendar</text>
  
    <circle cx="66" cy="149.83333333333334" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="156.83333333333334" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">1</text>
    <text x="108" y="144.83333333333334" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Wax guards: monthly</text>
    <text x="108" y="167.83333333333334" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Sooner if one aid goes quiet with good power</text>
    <line x1="108" y1="181.66666666666669" x2="756" y2="181.66666666666669" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="213.5" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="220.5" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">2</text>
    <text x="108" y="208.5" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Domes: 2-3 months</text>
    <text x="108" y="231.5" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Replace when stiff, yellowed, split or whistling</text>
    <line x1="108" y1="245.33333333333334" x2="756" y2="245.33333333333334" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="277.16666666666663" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="284.16666666666663" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">3</text>
    <text x="108" y="272.16666666666663" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">BTE tubing: 4-6 months</text>
    <text x="108" y="295.16666666666663" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">It hardens and cracks, thinning the sound</text>
    <line x1="108" y1="308.99999999999994" x2="756" y2="308.99999999999994" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="340.8333333333333" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="347.8333333333333" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">4</text>
    <text x="108" y="335.8333333333333" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Receivers: as needed</text>
    <text x="108" y="358.8333333333333" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">A clinic job — thin or distorted sound is the sign</text>
    <line x1="108" y1="372.66666666666663" x2="756" y2="372.66666666666663" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="404.49999999999994" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="411.49999999999994" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">5</text>
    <text x="108" y="399.49999999999994" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Dry them overnight</text>
    <text x="108" y="422.49999999999994" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Moisture is what shortens receiver life</text>
    <line x1="108" y1="436.33333333333326" x2="756" y2="436.33333333333326" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="468.16666666666663" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="475.16666666666663" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">6</text>
    <text x="108" y="463.16666666666663" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Clean and check yearly</text>
    <text x="108" y="486.16666666666663" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Vents, sound bore and contacts you cannot reach</text>
    
</svg>
