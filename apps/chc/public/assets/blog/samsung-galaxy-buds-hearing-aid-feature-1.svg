<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Samsung Galaxy Buds hearing aid feature">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs><rect width="800" height="520" fill="#ffffff"/><rect width="800" height="90" fill="url(#hd)"/><rect y="86" width="800" height="4" fill="#e0ae3c"/><text x="44" y="44" font-size="25" fill="#fff" font-family="Georgia, serif" font-weight="bold">Earbuds That Can Be Hearing Aids</text><text x="44" y="70" font-size="15" fill="#86d0d5" font-family="Georgia, serif">Samsung Galaxy Buds3 Pro and Buds4 Pro, FDA-cleared, rollout planned Q4 2026</text><rect x="50" y="140" width="220" height="250" rx="14" fill="#fbf7ef" stroke="#e5eceb" stroke-width="2"/><circle cx="160" cy="195" r="32" fill="#155f6b"/><text x="160" y="207" font-size="32" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">1</text><text x="160" y="262" font-size="24" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Test</text><text x="160" y="296" font-size="14.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Five-minute hearing</text><text x="160" y="318" font-size="14.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">test in the app</text><path d="M278,265 l14,0 m-6,-7 l7,7 l-7,7" fill="none" stroke="#e0ae3c" stroke-width="3"/><rect x="300" y="140" width="220" height="250" rx="14" fill="#fbf7ef" stroke="#e5eceb" stroke-width="2"/><circle cx="410" cy="195" r="32" fill="#155f6b"/><text x="410" y="207" font-size="32" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">2</text><text x="410" y="262" font-size="24" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Fit</text><text x="410" y="296" font-size="14.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">App builds a fitting</text><text x="410" y="318" font-size="14.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">with NAL-NL2</text><path d="M528,265 l14,0 m-6,-7 l7,7 l-7,7" fill="none" stroke="#e0ae3c" stroke-width="3"/><rect x="550" y="140" width="220" height="250" rx="14" fill="#fbf7ef" stroke="#e5eceb" stroke-width="2"/><circle cx="660" cy="195" r="32" fill="#155f6b"/><text x="660" y="207" font-size="32" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">3</text><text x="660" y="262" font-size="24" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Listen</text><text x="660" y="296" font-size="14.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Earbuds amplify speech</text><text x="660" y="318" font-size="14.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">in front of you</text><rect x="50" y="420" width="300" height="34" rx="17" fill="#e0ae3c"/><text x="200" y="443" font-size="14.5" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Adults 18+ with mild to moderate loss</text><text x="400" y="490" font-size="15" fill="#21424b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Not a substitute for a full hearing evaluation</text>
</svg>
