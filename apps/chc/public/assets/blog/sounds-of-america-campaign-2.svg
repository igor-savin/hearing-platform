<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Three steps to join Sounds of America">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs>
<rect width="800" height="520" fill="#ffffff"/><rect width="800" height="90" fill="url(#hd)"/><rect y="86" width="800" height="4" fill="#e0ae3c"/>
<text x="44" y="44" font-family="Georgia, serif" font-size="25" fill="#ffffff" font-weight="bold">Three Steps to Join</text>
<text x="44" y="70" font-family="Georgia, serif" font-size="15" fill="#86d0d5">Sounds of America, an eight-week campaign</text><circle cx="66" cy="168" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/><text x="66" y="175" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">1</text><text x="108" y="163" font-size="22" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Pick a sound</text><text x="108" y="190" font-size="16" fill="#6b8086" font-family="Georgia, serif">Think of one you never want to lose</text><circle cx="66" cy="278" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/><text x="66" y="285" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">2</text><text x="108" y="273" font-size="22" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Record a short video</text><text x="108" y="300" font-size="16" fill="#6b8086" font-family="Georgia, serif">Say what sound reminds you of home</text><circle cx="66" cy="388" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/><text x="66" y="395" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">3</text><text x="108" y="383" font-size="22" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Post it</text><text x="108" y="410" font-size="16" fill="#6b8086" font-family="Georgia, serif">Facebook or Instagram, with #SoundsOfAmerica</text>
<text x="44" y="496" font-family="Georgia, serif" font-size="13" fill="#6b8086">California Hearing Center. Campaign run by HIA and HLAA.</text></svg>