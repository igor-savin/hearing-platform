<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Five hearing benefit checks before December 7">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs><rect width="800" height="520" fill="#ffffff"/><rect width="800" height="90" fill="url(#hd)"/><rect y="86" width="800" height="4" fill="#e0ae3c"/><text x="44" y="44" font-size="25" fill="#fff" font-family="Georgia, serif" font-weight="bold">Five Hearing Checks Before December 7</text><text x="44" y="70" font-size="15" fill="#86d0d5" font-family="Georgia, serif">General information, not insurance advice</text><rect x="30" y="112" width="740" height="68" rx="10" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><circle cx="72" cy="146" r="22" fill="#155f6b"/><text x="72" y="154" font-size="22" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">1</text><text x="116" y="142" font-size="17.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Read your Annual Notice of Change</text><text x="116" y="166" font-size="14" fill="#6b8086" font-family="Georgia, serif">Hearing section, line by line</text><rect x="30" y="192" width="740" height="68" rx="10" fill="#fff" stroke="#e5eceb" stroke-width="1.5"/><circle cx="72" cy="226" r="22" fill="#155f6b"/><text x="72" y="234" font-size="22" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">2</text><text x="116" y="222" font-size="17.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Check the hearing aid allowance</text><text x="116" y="246" font-size="14" fill="#6b8086" font-family="Georgia, serif">Amount, one or two aids, renewal, brands</text><rect x="30" y="272" width="740" height="68" rx="10" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><circle cx="72" cy="306" r="22" fill="#155f6b"/><text x="72" y="314" font-size="22" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">3</text><text x="116" y="302" font-size="17.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Confirm your audiologist is in network</text><text x="116" y="326" font-size="14" fill="#6b8086" font-family="Georgia, serif">Call with plan name and member number</text><rect x="30" y="352" width="740" height="68" rx="10" fill="#fff" stroke="#e5eceb" stroke-width="1.5"/><circle cx="72" cy="386" r="22" fill="#155f6b"/><text x="72" y="394" font-size="22" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">4</text><text x="116" y="382" font-size="17.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Check exams and referral rules</text><text x="116" y="406" font-size="14" fill="#6b8086" font-family="Georgia, serif">Routine exams, visit limits, referrals</text><rect x="30" y="432" width="740" height="68" rx="10" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><circle cx="72" cy="466" r="22" fill="#155f6b"/><text x="72" y="474" font-size="22" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">5</text><text x="116" y="462" font-size="17.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Ask about OTC or flex-card benefits</text><text x="116" y="486" font-size="14" fill="#6b8086" font-family="Georgia, serif">Does it cover OTC aids or earbuds?</text>
</svg>
