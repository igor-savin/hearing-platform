name: Lighthouse CI

# Runs Lighthouse against the built site on every push to main and every PR,
# so performance / accessibility / best-practices / SEO regressions surface
# (as warnings) in the Actions log with a shareable report link.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid piling up runs on rapid pushes to the same ref.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          # Post the status + report link back to the PR when the token is available.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
