name: Lighthouse CI

# Runs Lighthouse against the built site on every push to main and every PR,
# so performance / accessibility / best-practices / SEO regressions surface
# (as warnings) in the Actions log with a shareable report link.
#
# Kept identical to the sister practice's workflow (California Hearing Center)
# apart from the Node version and the four sampled URLs — the four categories
# and their thresholds are deliberately the same on both properties, so a score
# on one site means the same thing as a score on the other.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Avoid piling up runs on rapid pushes to the same ref.
concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the engines.node pin in package.json.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
        env:
          # Post the status + report link back to the PR when the token is available.
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      # Phones are where speed regressions hid: the desktop run above scored
      # these pages 95+ while the mobile lab score sat near 60. Same thresholds
      # on both sister sites. Warn-only, like the desktop run.
      - name: Run Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.14.x autorun --config=.lighthouserc.mobile.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
