<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="California Hearing Center serving Los Gatos">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#dff0f1"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="900" height="540" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="540" fill="url(#sky)"/>
    
    <path d="M0 420 q225 -70 450 -20 t450 -30 V540 H0 Z" fill="#155f6b" opacity="0.16"/>
    <g transform="translate(150 300)">
      <path d="M0 90 L70 40 L140 90 Z" fill="#105966"/>
      <rect x="18" y="90" width="104" height="70" fill="#155f6b"/>
      <rect x="58" y="118" width="24" height="42" fill="#e0ae3c"/>
    </g>
    <g fill="#105966">
      <circle cx="560" cy="330" r="46"/><rect x="554" y="330" width="12" height="60"/>
      <circle cx="650" cy="350" r="34"/><rect x="645" y="350" width="10" height="46"/>
      <circle cx="720" cy="320" r="52"/><rect x="714" y="320" width="12" height="70"/>
    </g>
    <!-- unifying hearing motif: soundwave arcs radiating from a listening point -->
    <g transform="translate(96 150)" fill="none" stroke="#155f6b" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <circle cx="0" cy="0" r="7" fill="#155f6b" stroke="none"/>
      <path d="M18 -20 a30 30 0 0 1 0 40"/>
      <path d="M34 -34 a52 52 0 0 1 0 68"/>
      <path d="M50 -48 a74 74 0 0 1 0 96"/>
    </g>
    <!-- title band -->
    <rect x="0" y="0" width="900" height="118" fill="#155f6b"/>
    <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#ffffff">Los Gatos</text>
    <text x="60" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#86d0d5" letter-spacing="1.5">CALIFORNIA HEARING CENTER · AREAS WE SERVE</text>
    <rect x="0" y="118" width="900" height="5" fill="#e0ae3c"/>
  </g>
</svg>