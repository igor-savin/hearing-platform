<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="California Hearing Center serving Milpitas">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#dff0f1"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="900" height="540" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="540" fill="url(#sky)"/>
    
    <rect x="0" y="470" width="900" height="70" fill="#21424b" opacity="0.14"/>
    <line x1="0" y1="452" x2="900" y2="452" stroke="#6b8086" stroke-width="4"/>
    <line x1="0" y1="470" x2="900" y2="470" stroke="#6b8086" stroke-width="4"/>
    <g transform="translate(300 300)">
      <rect x="0" y="0" width="300" height="140" rx="18" fill="#155f6b"/>
      <rect x="20" y="24" width="60" height="54" rx="8" fill="#86d0d5"/>
      <rect x="120" y="24" width="60" height="54" rx="8" fill="#86d0d5"/>
      <rect x="220" y="24" width="60" height="54" rx="8" fill="#86d0d5"/>
      <circle cx="70" cy="150" r="20" fill="#21424b"/><circle cx="230" cy="150" r="20" fill="#21424b"/>
      <rect x="-8" y="70" width="16" height="40" rx="4" fill="#e0ae3c"/>
    </g>
    <g stroke="#6b8086" stroke-width="4" opacity="0.6"><path d="M120 250 v46"/><path d="M780 250 v46"/><path d="M120 262 H780"/></g>
    <!-- unifying hearing motif: soundwave arcs radiating from a listening point -->
    <g transform="translate(96 150)" fill="none" stroke="#155f6b" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <circle cx="0" cy="0" r="7" fill="#155f6b" stroke="none"/>
      <path d="M18 -20 a30 30 0 0 1 0 40"/>
      <path d="M34 -34 a52 52 0 0 1 0 68"/>
      <path d="M50 -48 a74 74 0 0 1 0 96"/>
    </g>
    <!-- title band -->
    <rect x="0" y="0" width="900" height="118" fill="#155f6b"/>
    <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#ffffff">Milpitas</text>
    <text x="60" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#86d0d5" letter-spacing="1.5">CALIFORNIA HEARING CENTER · AREAS WE SERVE</text>
    <rect x="0" y="118" width="900" height="5" fill="#e0ae3c"/>
  </g>
</svg>