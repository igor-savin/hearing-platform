<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="California Hearing Center serving Dixon">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#dff0f1"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="900" height="540" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="540" fill="url(#sky)"/>
    
    <path d="M0 500 H900" stroke="#21424b" stroke-width="0" />
    <rect x="0" y="500" width="900" height="40" fill="#21424b" opacity="0.12"/>
    <g transform="translate(330 250)">
      <path d="M120 0 L200 70 L40 70 Z" fill="#105966"/>
      <path d="M100 -30 q20 -30 40 0" fill="none" stroke="#e0ae3c" stroke-width="6"/>
      <rect x="40" y="70" width="160" height="20" fill="#105966"/>
      <g fill="#155f6b"><rect x="52" y="90" width="18" height="120"/><rect x="84" y="90" width="18" height="120"/><rect x="116" y="90" width="18" height="120"/><rect x="148" y="90" width="18" height="120"/><rect x="180" y="90" width="18" height="120"/></g>
      <rect x="40" y="210" width="160" height="20" fill="#105966"/>
    </g>
    <g fill="#105966"><circle cx="180" cy="360" r="40"/><rect x="174" y="360" width="12" height="54"/><circle cx="740" cy="360" r="40"/><rect x="734" y="360" width="12" height="54"/></g>
    <!-- unifying hearing motif: soundwave arcs radiating from a listening point -->
    <g transform="translate(96 150)" fill="none" stroke="#155f6b" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <circle cx="0" cy="0" r="7" fill="#155f6b" stroke="none"/>
      <path d="M18 -20 a30 30 0 0 1 0 40"/>
      <path d="M34 -34 a52 52 0 0 1 0 68"/>
      <path d="M50 -48 a74 74 0 0 1 0 96"/>
    </g>
    <!-- title band -->
    <rect x="0" y="0" width="900" height="118" fill="#155f6b"/>
    <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#ffffff">Dixon</text>
    <text x="60" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#86d0d5" letter-spacing="1.5">CALIFORNIA HEARING CENTER · AREAS WE SERVE</text>
    <rect x="0" y="118" width="900" height="5" fill="#e0ae3c"/>
  </g>
</svg>