<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="California Hearing Center serving South San Francisco">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/><stop offset="1" stop-color="#dff0f1"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="900" height="540" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="540" fill="url(#sky)"/>
    
    <g fill="#155f6b">
      <rect x="120" y="300" width="70" height="240"/>
      <rect x="210" y="250" width="60" height="290" fill="#105966"/>
      <rect x="290" y="330" width="66" height="210"/>
      <rect x="376" y="280" width="58" height="260" fill="#105966"/>
      <rect x="452" y="340" width="72" height="200"/>
    </g>
    <g fill="#e0ae3c" opacity="0.92">
      <rect x="132" y="316" width="10" height="16"/><rect x="152" y="316" width="10" height="16"/><rect x="172" y="316" width="10" height="16"/><rect x="132" y="350" width="10" height="16"/><rect x="152" y="350" width="10" height="16"/><rect x="172" y="350" width="10" height="16"/><rect x="132" y="384" width="10" height="16"/><rect x="152" y="384" width="10" height="16"/><rect x="172" y="384" width="10" height="16"/><rect x="132" y="418" width="10" height="16"/><rect x="152" y="418" width="10" height="16"/><rect x="172" y="418" width="10" height="16"/>
      <rect x="222" y="268" width="11" height="18"/><rect x="244" y="268" width="11" height="18"/><rect x="222" y="302" width="11" height="18"/><rect x="244" y="302" width="11" height="18"/><rect x="222" y="336" width="11" height="18"/><rect x="244" y="336" width="11" height="18"/><rect x="222" y="370" width="11" height="18"/><rect x="244" y="370" width="11" height="18"/><rect x="222" y="404" width="11" height="18"/><rect x="244" y="404" width="11" height="18"/>
    </g>
    <rect x="0" y="500" width="900" height="40" fill="#21424b" opacity="0.12"/>
    <!-- unifying hearing motif: soundwave arcs radiating from a listening point -->
    <g transform="translate(96 150)" fill="none" stroke="#155f6b" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <circle cx="0" cy="0" r="7" fill="#155f6b" stroke="none"/>
      <path d="M18 -20 a30 30 0 0 1 0 40"/>
      <path d="M34 -34 a52 52 0 0 1 0 68"/>
      <path d="M50 -48 a74 74 0 0 1 0 96"/>
    </g>
    <!-- title band -->
    <rect x="0" y="0" width="900" height="118" fill="#155f6b"/>
    <text x="60" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#ffffff">South San Francisco</text>
    <text x="60" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#86d0d5" letter-spacing="1.5">CALIFORNIA HEARING CENTER · AREAS WE SERVE</text>
    <rect x="0" y="118" width="900" height="5" fill="#e0ae3c"/>
  </g>
