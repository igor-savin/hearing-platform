<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 512" role="img" aria-label="Four Questions to Ask About Any AI Claim">
  <defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs>
  <rect width="800" height="512" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="90" fill="url(#hd)"/>
  <rect x="0" y="86" width="800" height="4" fill="#e0ae3c"/>
  <text x="44" y="44" font-family="Georgia, serif" font-size="25" fill="#ffffff" font-weight="bold">Four Questions to Ask About Any AI Claim</text>
  <text x="44" y="70" font-family="Georgia, serif" font-size="15" fill="#86d0d5">How to read a hearing aid launch without being sold to</text>

    <circle cx="66" cy="156.2" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="163.2" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">1</text>
    <text x="108" y="151.2" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Who measured it?</text>
    <text x="108" y="174.2" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Most launch numbers come from the maker's own lab</text>
    <line x1="108" y1="194.39999999999998" x2="756" y2="194.39999999999998" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="232.6" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="239.6" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">2</text>
    <text x="108" y="227.6" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Compared against what?</text>
    <text x="108" y="250.6" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Often the maker's last model, not a competitor</text>
    <line x1="108" y1="270.8" x2="756" y2="270.8" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="309.0" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="316.0" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">3</text>
    <text x="108" y="304.0" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Lab figure or patient result?</text>
    <text x="108" y="327.0" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">“Predicted” means modelled, not tested on people</text>
    <line x1="108" y1="347.2" x2="756" y2="347.2" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="385.4" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="392.4" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">4</text>
    <text x="108" y="380.4" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Has anyone independent checked?</text>
    <text x="108" y="403.4" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">At launch the answer is usually no</text>
    <line x1="108" y1="423.59999999999997" x2="756" y2="423.59999999999997" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="461.79999999999995" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="468.79999999999995" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">5</text>
    <text x="108" y="456.79999999999995" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Was it verified on your ear?</text>
    <text x="108" y="479.79999999999995" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Real-ear measurement outweighs the architecture</text>
    <line x1="108" y1="499.99999999999994" x2="756" y2="499.99999999999994" stroke="#e5eceb" stroke-width="2"/>
</svg>
