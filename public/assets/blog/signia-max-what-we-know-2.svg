<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 637" role="img" aria-label="Confirmed, Claimed, and Unknown">
  <defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs>
  <rect width="800" height="637" fill="#ffffff"/>
