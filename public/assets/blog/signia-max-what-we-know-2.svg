    <text x="108" y="403.4" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">54x processing power — footnote reads “vs Signia IX”</text>
    <line x1="108" y1="423.6" x2="756" y2="423.6" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="461.8" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="468.8" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">5</text>
    <text x="108" y="456.8" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Not yet known</text>
    <text x="108" y="479.8" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">No independent lab measurement of any kind</text>
    <line x1="108" y1="500.0" x2="756" y2="500.0" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="538.2" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="545.2" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">6</text>
    <text x="108" y="533.2" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Not yet known</text>
    <text x="108" y="556.2" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">No price, no tiers, no IP rating published</text>
    <line x1="108" y1="576.4" x2="756" y2="576.4" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="614.6" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="621.6" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">7</text>
    <text x="108" y="609.6" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Not available</text>
