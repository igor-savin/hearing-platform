<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="OTC earbuds compared with prescription hearing aids">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs><rect width="800" height="520" fill="#ffffff"/><rect width="800" height="90" fill="url(#hd)"/><rect y="86" width="800" height="4" fill="#e0ae3c"/><text x="44" y="44" font-size="25" fill="#fff" font-family="Georgia, serif" font-weight="bold">OTC Earbuds vs. Prescription Hearing Aids</text><text x="44" y="70" font-size="15" fill="#86d0d5" font-family="Georgia, serif">Neither is better for everyone</text><text x="300" y="128" font-size="16" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">OTC earbuds</text><text x="580" y="128" font-size="16" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Prescription aids</text><rect x="30" y="150" width="740" height="60" rx="8" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="186" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Who it suits</text><text x="300" y="186" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Mild to moderate loss, adults</text><text x="580" y="186" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Mild through profound loss</text><rect x="30" y="220" width="740" height="60" rx="8" fill="#fff" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="256" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">How it is fitted</text><text x="300" y="256" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Self-fit from an app test</text><text x="580" y="256" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Programmed from a full evaluation</text><rect x="30" y="290" width="740" height="60" rx="8" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="326" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Checked in your ear</text><text x="300" y="326" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">No</text><text x="580" y="326" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Real-ear measurement</text><rect x="30" y="360" width="740" height="60" rx="8" fill="#fff" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="396" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Follow-up care</text><text x="300" y="396" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Self-service</text><text x="580" y="396" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Fine-tuning, cleaning, repairs</text><rect x="30" y="430" width="740" height="60" rx="8" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="466" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Extras</text><text x="300" y="466" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Music, calls, LE Audio</text><text x="580" y="466" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Built to be worn all day</text>
</svg>
