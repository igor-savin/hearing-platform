<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Vertigo, Tiredness and Chills">
  <defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs>
  <rect width="800" height="520" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="90" fill="url(#hd)"/>
  <rect x="0" y="86" width="800" height="4" fill="#e0ae3c"/>
  <text x="44" y="44" font-family="Georgia, serif" font-size="25" fill="#ffffff" font-weight="bold">Vertigo, Tiredness and Chills</text>
  <text x="44" y="70" font-family="Georgia, serif" font-size="15" fill="#86d0d5">Five things to know</text>
  
    <circle cx="66" cy="156.2" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="163.2" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">1</text>
    <text x="108" y="151.2" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Tiredness is common</text>
    <text x="108" y="174.2" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">The brain works harder to stay balanced</text>
    <line x1="108" y1="194.39999999999998" x2="756" y2="194.39999999999998" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="232.60000000000002" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="239.60000000000002" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">2</text>
    <text x="108" y="227.60000000000002" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Some medicines cause drowsiness</text>
    <text x="108" y="250.60000000000002" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Do not drive if you feel sleepy</text>
    <line x1="108" y1="270.8" x2="756" y2="270.8" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="309" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="316" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">3</text>
    <text x="108" y="304" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Chills are not typical</text>
    <text x="108" y="327" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Not a listed inner-ear symptom</text>
    <line x1="108" y1="347.2" x2="756" y2="347.2" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="385.40000000000003" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="392.40000000000003" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">4</text>
    <text x="108" y="380.40000000000003" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Fever needs prompt care</text>
    <text x="108" y="403.40000000000003" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Dizziness with fever: call a clinician</text>
    <line x1="108" y1="423.6" x2="756" y2="423.6" stroke="#e5eceb" stroke-width="2"/>
    <circle cx="66" cy="461.8" r="24" fill="#fbf7ef" stroke="#e0ae3c" stroke-width="3"/>
    <text x="66" y="468.8" font-size="21" fill="#155f6b" text-anchor="middle" font-weight="bold" font-family="Georgia, serif">5</text>
    <text x="108" y="456.8" font-size="18.5" fill="#21424b" font-weight="bold" font-family="Georgia, serif">Red flags: call 911</text>
    <text x="108" y="479.8" font-size="14.5" fill="#6b8086" font-family="Georgia, serif">Trouble speaking, seeing or walking</text>
    
</svg>
