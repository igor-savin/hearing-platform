<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Conventional cochlear implant compared with TICI UNICO">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs><rect width="800" height="520" fill="#ffffff"/><rect width="800" height="90" fill="url(#hd)"/><rect y="86" width="800" height="4" fill="#e0ae3c"/><text x="44" y="44" font-size="25" fill="#fff" font-family="Georgia, serif" font-weight="bold">Conventional vs. Fully Implantable</text><text x="44" y="70" font-size="15" fill="#86d0d5" font-family="Georgia, serif">As reported at launch, September 29, 2026</text><text x="300" y="128" font-size="16" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Conventional</text><text x="580" y="128" font-size="16" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">TICI UNICO</text><rect x="30" y="150" width="740" height="60" rx="8" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="186" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Outside parts</text><text x="300" y="186" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Sound processor and coil</text><text x="580" y="186" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">None</text><rect x="30" y="220" width="740" height="60" rx="8" fill="#fff" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="256" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Microphone</text><text x="300" y="256" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">On the ear or head</text><text x="580" y="256" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Under the skin, about 6 mm deep</text><rect x="30" y="290" width="740" height="60" rx="8" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="326" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Battery</text><text x="300" y="326" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Replaceable or rechargeable, external</text><text x="580" y="326" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Rechargeable, inside, not replaceable</text><rect x="30" y="360" width="740" height="60" rx="8" fill="#fff" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="396" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">Charging</text><text x="300" y="396" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Swap or charge the processor</text><text x="580" y="396" font-size="13.5" fill="#21424b" font-family="Georgia, serif" text-anchor="middle">Magnetic unit over the scalp, 1 to 1.5 h</text><rect x="30" y="430" width="740" height="60" rx="8" fill="#fbf7ef" stroke="#e5eceb" stroke-width="1.5"/><text x="46" y="466" font-size="15.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold">U.S. status</text><text x="300" y="466" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Available</text><text x="580" y="466" font-size="13.5" fill="#21424b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Not FDA-approved, no date announced</text>
</svg>
