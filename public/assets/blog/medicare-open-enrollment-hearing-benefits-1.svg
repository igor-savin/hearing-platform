<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-label="Medicare enrollment dates that matter for 2027 hearing benefits">
<defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs><rect width="800" height="520" fill="#ffffff"/><rect width="800" height="90" fill="url(#hd)"/><rect y="86" width="800" height="4" fill="#e0ae3c"/><text x="44" y="44" font-size="25" fill="#fff" font-family="Georgia, serif" font-weight="bold">Medicare Open Enrollment 2027</text><text x="44" y="70" font-size="15" fill="#86d0d5" font-family="Georgia, serif">Annual Enrollment: October 15 to December 7, 2026</text><rect x="60" y="250" width="680" height="10" rx="5" fill="#e5eceb"/><rect x="190" y="246" width="250" height="18" rx="9" fill="#e0ae3c"/><rect x="560" y="246" width="180" height="18" rx="9" fill="#155f6b"/><circle cx="100" cy="255" r="11" fill="#fff" stroke="#155f6b" stroke-width="4"/><text x="100" y="214" font-size="19" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Sept</text><text x="100" y="192" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Notice of Change</text><circle cx="190" cy="255" r="11" fill="#fff" stroke="#155f6b" stroke-width="4"/><text x="190" y="306" font-size="19" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Oct 15</text><text x="190" y="330" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Enrollment opens</text><circle cx="440" cy="255" r="11" fill="#fff" stroke="#155f6b" stroke-width="4"/><text x="440" y="214" font-size="19" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Dec 7</text><text x="440" y="192" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">Deadline</text><circle cx="560" cy="255" r="11" fill="#fff" stroke="#155f6b" stroke-width="4"/><text x="560" y="306" font-size="19" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Jan 1</text><text x="560" y="330" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">New plans start</text><circle cx="740" cy="255" r="11" fill="#fff" stroke="#155f6b" stroke-width="4"/><text x="740" y="214" font-size="19" fill="#155f6b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Mar 31</text><text x="740" y="192" font-size="13.5" fill="#6b8086" font-family="Georgia, serif" text-anchor="middle">MA window ends</text><rect x="200" y="395" width="400" height="34" rx="17" fill="#155f6b"/><text x="400" y="418" font-size="14.5" fill="#fff" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Current MA members: one change, Jan 1 to Mar 31</text><text x="400" y="470" font-size="15" fill="#21424b" font-family="Georgia, serif" font-weight="bold" text-anchor="middle">Check your own plan. Benefits vary by plan and county.</text>
