<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="The eight finishes of the Signia Pure Charge and Go MaX">
  <defs><linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#155f6b"/><stop offset="1" stop-color="#105966"/></linearGradient></defs>
  <rect width="800" height="380" fill="#ffffff"/>
  <rect x="0" y="0" width="800" height="90" fill="url(#hd)"/>
  <rect x="0" y="86" width="800" height="4" fill="#e0ae3c"/>
  <text x="44" y="44" font-family="Georgia, serif" font-size="25" fill="#ffffff" font-weight="bold">Eight finishes</text>
  <text x="44" y="70" font-family="Georgia, serif" font-size="15" fill="#86d0d5">Signia Pure Charge&amp;Go MaX</text>
  <circle cx="70" cy="150" r="30" fill="#c2ae9d" stroke="#c2ae9d" stroke-width="1.5"/>
  <text x="70" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Beige</text>
  <circle cx="255" cy="150" r="30" fill="#171f27" stroke="#171f27" stroke-width="1.5"/>
  <text x="255" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Black</text>
  <circle cx="440" cy="150" r="30" fill="#916c51" stroke="#916c51" stroke-width="1.5"/>
  <text x="440" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Chestnut Brown</text>
  <circle cx="625" cy="150" r="30" fill="#b9b2aa" stroke="#b9b2aa" stroke-width="1.5"/>
  <text x="625" y="208" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Dark Champagne</text>
  <circle cx="70" cy="255" r="30" fill="#d3c99d" stroke="#d3c99d" stroke-width="1.5"/>
  <text x="70" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Honey Blonde</text>
  <circle cx="255" cy="255" r="30" fill="#f1eae3" stroke="#e5eceb" stroke-width="1.5"/>
  <text x="255" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Rose Gold</text>
  <circle cx="440" cy="255" r="30" fill="#e2e4e5" stroke="#e5eceb" stroke-width="1.5"/>
  <text x="440" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Silver</text>
  <circle cx="625" cy="255" r="30" fill="#898b8d" stroke="#898b8d" stroke-width="1.5"/>
  <text x="625" y="313" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" fill="#21424b">Titanium Grey</text>
  <line x1="44" y1="322" x2="756" y2="322" stroke="#e5eceb" stroke-width="2"/>
  <text x="44" y="352" font-family="Georgia, serif" font-size="14" fill="#6b8086">Every finish carries the same technology — the choice is cosmetic.</text>
