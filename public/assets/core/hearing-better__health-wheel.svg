<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img" aria-label="Wheel graphic with hearing loss in the center and eight linked topics around it: diabetes, smoking, medications, heart health, kidney disease, balance, dementia, and tinnitus.">
  <rect width="900" height="800" rx="26" fill="#fbf7ef"/>
  <text x="450" y="60" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#155f6b">Hearing and your health</text>
  <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5c7178">Hearing loss is linked to many other conditions.</text><line x1="450" y1="400" x2="450" y2="140" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="634" y2="216" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="710" y2="400" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="634" y2="584" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="450" y2="660" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="266" y2="584" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="190" y2="400" stroke="#86d0d5" stroke-width="3"/><line x1="450" y1="400" x2="266" y2="216" stroke="#86d0d5" stroke-width="3"/><rect x="360" y="112" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="450" y="147" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Diabetes</text><rect x="544" y="188" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="634" y="223" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Smoking</text><rect x="620" y="372" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="710" y="407" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Medications</text><rect x="544" y="556" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="634" y="591" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Heart health</text><rect x="360" y="632" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="450" y="667" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Kidney disease</text><rect x="176" y="556" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="266" y="591" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Balance</text><rect x="100" y="372" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="190" y="407" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Dementia</text><rect x="176" y="188" width="180" height="56" rx="28" fill="#ffffff" stroke="#155f6b" stroke-width="2.5"/>
  <text x="266" y="223" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#21424b">Tinnitus</text><circle cx="450" cy="400" r="88" fill="#155f6b"/><text x="450" y="396" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#ffffff">Hearing</text><text x="450" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#ffffff">loss</text>
  <text x="450" y="742" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5c7178">Links are associations found in research. They do not prove cause. Ask your doctor about your own health.</text>
  <text x="450" y="774" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#155f6b" letter-spacing="1">CALIFORNIA HEARING CENTER</text>
</svg>
