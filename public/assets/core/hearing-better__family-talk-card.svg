<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Five habits for talking with someone who has hearing loss: get their attention, face them, rephrase, cut the noise, and pause.">
  <rect width="900" height="640" rx="26" fill="#fbf7ef"/>
  <text x="50" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#155f6b">Five habits for talking together</text>
  <text x="50" y="118" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5c7178">Small changes that help someone with hearing loss follow you.</text><rect x="50" y="150" width="800" height="72" rx="14" fill="#ffffff" stroke="#86d0d5" stroke-width="2"/>
  <circle cx="92" cy="186" r="22" fill="#e0ae3c"/><text x="92" y="194" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">1</text>
  <text x="135" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">Get their attention</text>
  <text x="135" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5c7178">Say their name. Wait for eye contact.</text><rect x="50" y="238" width="800" height="72" rx="14" fill="#ffffff" stroke="#86d0d5" stroke-width="2"/>
  <circle cx="92" cy="274" r="22" fill="#e0ae3c"/><text x="92" y="282" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">2</text>
  <text x="135" y="270" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">Face them</text>
  <text x="135" y="296" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5c7178">Stay close. Keep your face in the light.</text><rect x="50" y="326" width="800" height="72" rx="14" fill="#ffffff" stroke="#86d0d5" stroke-width="2"/>
  <circle cx="92" cy="362" r="22" fill="#e0ae3c"/><text x="92" y="370" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">3</text>
  <text x="135" y="358" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">Rephrase</text>
  <text x="135" y="384" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5c7178">Use different words. Do not just repeat.</text><rect x="50" y="414" width="800" height="72" rx="14" fill="#ffffff" stroke="#86d0d5" stroke-width="2"/>
  <circle cx="92" cy="450" r="22" fill="#e0ae3c"/><text x="92" y="458" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">4</text>
  <text x="135" y="446" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">Cut the noise</text>
  <text x="135" y="472" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5c7178">Turn off the TV. Move to a quiet spot.</text><rect x="50" y="502" width="800" height="72" rx="14" fill="#ffffff" stroke="#86d0d5" stroke-width="2"/>
  <circle cx="92" cy="538" r="22" fill="#e0ae3c"/><text x="92" y="546" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">5</text>
  <text x="135" y="534" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#21424b">Pause</text>
  <text x="135" y="560" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#5c7178">Give them time to follow. Do not rush.</text><text x="50" y="612" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#155f6b" font-weight="700" letter-spacing="1">CALIFORNIA HEARING CENTER · 650-342-9449</text>
</svg>
