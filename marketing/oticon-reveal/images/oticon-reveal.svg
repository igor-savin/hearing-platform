<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0.18">
      <stop offset="0%"   stop-color="#582840"/>
      <stop offset="10%"  stop-color="#7c4460"/>
      <stop offset="26%"  stop-color="#a06a85"/>
      <stop offset="40%"  stop-color="#8d5573"/>
      <stop offset="66%"  stop-color="#6d3652"/>
      <stop offset="88%"  stop-color="#502339"/>
      <stop offset="100%" stop-color="#41192b"/>
    </linearGradient>

    <linearGradient id="shellNose" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#8c5470"/>
      <stop offset="45%"  stop-color="#703d59"/>
      <stop offset="100%" stop-color="#4a1f33"/>
    </linearGradient>

    <linearGradient id="sheenV" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="22%"  stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2a1220" stop-opacity="0.30"/>
    </linearGradient>

    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0%"   stop-color="#8a9199"/>
      <stop offset="32%"  stop-color="#eef1f4"/>
      <stop offset="62%"  stop-color="#b4bac1"/>
      <stop offset="100%" stop-color="#71787f"/>
    </linearGradient>

    <linearGradient id="wireGrad" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%"   stop-color="#d3d8dd"/>
      <stop offset="45%"  stop-color="#a0a7ae"/>
      <stop offset="100%" stop-color="#7c838b"/>
    </linearGradient>

    <radialGradient id="domeGrad" cx="0.34" cy="0.26" r="0.9">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="52%"  stop-color="#f0f4f8" stop-opacity="0.68"/>
      <stop offset="100%" stop-color="#c0c9d3" stop-opacity="0.6"/>
    </radialGradient>

    <linearGradient id="coreBlue" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#6b9bdd"/>
      <stop offset="48%"  stop-color="#3364b4"/>
      <stop offset="100%" stop-color="#1e4180"/>
    </linearGradient>

    <filter id="softShadow" x="-45%" y="-35%" width="190%" height="175%">
      <feDropShadow dx="4" dy="12" stdDeviation="13" flood-color="#3a2130" flood-opacity="0.24"/>
    </filter>
    <filter id="tinyShadow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#3a2130" flood-opacity="0.22"/>
    </filter>
    <filter id="blur7"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- ============ RECEIVER WIRE ============ -->
  <g filter="url(#tinyShadow)">
    <path d="M 360 166 C 438 138, 526 182, 558 268 C 578 330, 574 396, 558 442"
          fill="none" stroke="#767d85" stroke-width="9" stroke-linecap="round"/>
    <path d="M 360 166 C 438 138, 526 182, 558 268 C 578 330, 574 396, 558 442"
          fill="none" stroke="url(#wireGrad)" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M 356 166 C 430 140, 512 180, 546 254"
          fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- ============ RECEIVER + OPEN DOME ============ -->
  <g filter="url(#tinyShadow)">
    <g transform="translate(556 452) rotate(12)">
      <rect x="-13" y="-20" width="26" height="40" rx="12" fill="url(#shell)"/>
      <rect x="-9.5" y="-16" width="7" height="31" rx="3.5" fill="#ffffff" opacity="0.25"/>
    </g>
    <!-- tulip-shaped open dome -->
    <g transform="translate(560 494) rotate(11)">
      <path d="M 0 -22
               C 22 -22, 35 -4, 34 18
               C 33 40, 19 52, 0 52
               C -19 52, -33 40, -34 18
               C -35 -4, -22 -22, 0 -22 Z"
            fill="url(#domeGrad)" stroke="#a9b3bf" stroke-width="1.4"/>
      <path d="M -7 -19 C 5 -20, 12 -8, 11 7 C 10 21, 3 30, -5 29 C -13 28, -16 18, -15 4 C -14 -9, -13 -18, -7 -19 Z"
            fill="url(#coreBlue)" opacity="0.8"/>
      <ellipse cx="-19" cy="27" rx="5" ry="8" fill="#8f9aa8" opacity="0.28"/>
      <ellipse cx="19"  cy="27" rx="5" ry="8" fill="#8f9aa8" opacity="0.28"/>
      <ellipse cx="0"   cy="42" rx="7" ry="5" fill="#8f9aa8" opacity="0.24"/>
      <ellipse cx="-13" cy="-4" rx="8" ry="14" fill="#ffffff" opacity="0.6" filter="url(#blur2)"/>
    </g>
  </g>

  <!-- ============ BODY ============ -->
  <g filter="url(#softShadow)">

    <!-- tapered nose where the receiver wire exits -->
    <path d="M 298 186
             C 318 172, 340 162, 353 167
             C 363 171, 361 184, 350 197
             C 338 211, 322 224, 310 230
             C 300 218, 294 198, 298 186 Z"
          fill="url(#shellNose)"/>

    <!-- metal ferrule -->
    <g transform="translate(355 172) rotate(-44)">
      <rect x="-8" y="-12" width="16" height="24" rx="7.5" fill="url(#metal)"/>
      <rect x="-8" y="-1"  width="16" height="3.6" fill="#6f767e" opacity="0.5"/>
    </g>

    <!-- main shell: gently curved, tapered banana -->
    <path d="M 252 268
             C 252 216, 272 190, 300 190
             C 328 190, 346 216, 346 268
             C 352 344, 354 428, 350 488
             C 348 550, 326 582, 297 582
             C 268 582, 246 550, 244 488
             C 240 428, 246 344, 252 268 Z"
          fill="url(#shell)"/>
    <path d="M 252 268
             C 252 216, 272 190, 300 190
             C 328 190, 346 216, 346 268
             C 352 344, 354 428, 350 488
             C 348 550, 326 582, 297 582
             C 268 582, 246 550, 244 488
             C 240 428, 246 344, 252 268 Z"
          fill="url(#sheenV)"/>

    <!-- left-edge specular streak -->
    <path d="M 262 262 C 262 224, 276 206, 288 206
             C 288 320, 288 460, 288 566
             C 276 562, 262 536, 260 488 C 257 424, 258 336, 262 262 Z"
          fill="url(#spec)" opacity="0.6" filter="url(#blur7)"/>

    <!-- right rim light -->
    <path d="M 342 246 C 342 214, 328 196, 312 194" fill="none"
          stroke="#dcaec3" stroke-width="3" opacity="0.5" filter="url(#blur2)"/>
    <path d="M 348 290 C 351 380, 351 452, 347 500" fill="none"
          stroke="#c992ac" stroke-width="3.5" opacity="0.34" filter="url(#blur4)"/>

    <!-- dual microphone ports -->
    <g opacity="0.9">
      <rect x="285" y="262" width="27" height="6.5" rx="3.2" fill="#301524" transform="rotate(-3 298 265)"/>
      <rect x="285" y="286" width="27" height="6.5" rx="3.2" fill="#301524" transform="rotate(-3 298 289)"/>
    </g>

    <!-- oticon wordmark -->
    <text x="298" y="392" text-anchor="middle" transform="rotate(-1.5 298 392)"
          font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400"
          letter-spacing="0.6" fill="#ffffff" opacity="0.96">oticon</text>

    <!-- push button -->
    <g transform="translate(298 468)">
      <rect x="-17" y="-9.5" width="34" height="19" rx="9.5" fill="#3d1a2c" opacity="0.85"/>
      <rect x="-14.5" y="-7" width="29" height="14" rx="7" fill="#7e4763"/>
      <rect x="-14.5" y="-7" width="29" height="5"  rx="2.5" fill="#ffffff" opacity="0.24"/>
    </g>

    <!-- charging contacts -->
    <g transform="translate(297 552)">
      <rect x="-26" y="-4.5" width="20" height="9" rx="4.5" fill="#c6a04c"/>
      <rect x="-26" y="-4.5" width="20" height="3.5" rx="1.8" fill="#ffe9b0" opacity="0.65"/>
      <rect x="6"   y="-4.5" width="20" height="9" rx="4.5" fill="#c6a04c"/>
      <rect x="6"   y="-4.5" width="20" height="3.5" rx="1.8" fill="#ffe9b0" opacity="0.65"/>
    </g>

    <!-- bottom shading roll -->
    <path d="M 246 500 C 252 560, 344 560, 349 500 L 349 478
             C 340 546, 256 546, 246 478 Z"
          fill="#2b1220" opacity="0.26" filter="url(#blur7)"/>
  </g>
</svg>
